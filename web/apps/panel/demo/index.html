<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>INDIkit live demo</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Both views on
      // this page carry a theme toggle, and both read the class this sets.
      try {
        if (localStorage.getItem("indi-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
