[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indi-nexus"
version = "0.1.0"
description = "A modern, typed Python framework for INDI instrument control: driver SDK, async client, and FastAPI web bridge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Dan Avner" },
]
keywords = ["indi", "astronomy", "instrument-control", "asyncio", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "lxml>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "lxml-stubs>=0.5",
    "httpx>=0.27",
    "towncrier>=24.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
indi-nexus = "indi_nexus.cli:app"

[project.urls]
Homepage = "https://indi-nexus.sidereal.software/"
Documentation = "https://indi-nexus.sidereal.software/"
Repository = "https://github.com/sidereal-software/indi-nexus"
Issues = "https://github.com/sidereal-software/indi-nexus/issues"

# A trailing-slash ignore rule (`node_modules/`) matches files *under* the directory
# but not the directory path itself, so hatchling walks into node_modules anyway. Its
# walk follows symlinks and skips inodes it has already seen, and pnpm links
# web/apps/panel/node_modules/@indi-nexus/* at the real web/packages/* - so the walk
# consumed those inodes through the link and then dropped the real package sources
# from the sdist. Excluding the directory itself keeps the walk out of it entirely.
[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "**/node_modules",
    # `skip-excluded-dirs` prunes on exclusion alone, and unlike `include_path` it does
    # not consult `artifacts` - so without this the gitignored panel build output would
    # be pruned before the force-include below could bring it back.
    "!src/indi_nexus/web/static/panel",
]

# Build (and bundle) the TypeScript reference panel into the distribution so a
# plain `pip install` ships the UI. See hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/indi_nexus"]
# The built panel lives under the (gitignored) static dir; force-include it.
artifacts = ["src/indi_nexus/web/static/panel/**/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/indi_nexus/web/static/panel/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Transitional upstream warning from starlette's TestClient (httpx -> httpx2).
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# One changelog for the whole monorepo, because the Python package and the two npm
# packages release in lockstep (release-please `linked-versions`). Entries are written
# as files under changelog.d/ during the work and collected into CHANGELOG.md at
# release time; nothing hand-edits CHANGELOG.md. See DEVELOPMENT.md.
[tool.towncrier]
package = "indi_nexus"
package_dir = "src"
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/sidereal-software/indi-nexus/issues/{issue})"
start_string = "<!-- towncrier release notes start -->\n"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "packaging"
name = "Packaging"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true
