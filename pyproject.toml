[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indi-nexus"
version = "0.1.0"
description = "A modern, typed Python framework for INDI instrument control: driver SDK, async client, and FastAPI web bridge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Dan Avner" },
]
keywords = ["indi", "astronomy", "instrument-control", "asyncio", "fastapi"]
dependencies = [
    "pydantic>=2.6",
    "lxml>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "lxml-stubs>=0.5",
    "httpx>=0.27",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
indi-nexus = "indi_nexus.cli:app"

[project.urls]
Homepage = "https://github.com/mmtobservatory/indi-nexus"

# Build (and bundle) the TypeScript reference panel into the distribution so a
# plain `pip install` ships the UI. See hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/indi_nexus"]
# The built panel lives under the (gitignored) static dir; force-include it.
artifacts = ["src/indi_nexus/web/static/panel/**/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/indi_nexus/web/static/panel/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Transitional upstream warning from starlette's TestClient (httpx -> httpx2).
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
