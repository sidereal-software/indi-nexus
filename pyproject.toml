[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indi-nexus"
version = "0.2.0"
description = "A modern, typed Python framework for INDI instrument control: driver SDK, async client, and FastAPI web bridge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Dan Avner" },
]
keywords = ["indi", "astronomy", "instrument-control", "asyncio", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "lxml>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "lxml-stubs>=0.5",
    "httpx>=0.27",
]
docs = [
    # The imaging extra (Pillow + cairosvg) is what the built-in `social` plugin needs to
    # render the og:/twitter: preview cards; without it that plugin fails the build. It
    # also needs the system libcairo that cairosvg dlopens, which the Ubuntu runners
    # already have - Chrome depends on it - so docs.yml installs no apt packages. See the
    # note beside the plugin in mkdocs.yml for the macOS story, which is less pleasant.
    "mkdocs-material[imaging]>=9.5",
    "mkdocstrings[python]>=0.25",
]
# Only needed for the browser test in the nightly interop suite; everything else
# there runs against libindi with the plain dev extra.
interop = [
    "playwright>=1.49",
]

[project.scripts]
indi-nexus = "indi_nexus.cli:app"

[project.urls]
Homepage = "https://indi-nexus.sidereal.software/"
Documentation = "https://indi-nexus.sidereal.software/"
Repository = "https://github.com/sidereal-software/indi-nexus"
Issues = "https://github.com/sidereal-software/indi-nexus/issues"

# A trailing-slash ignore rule (`node_modules/`) matches files *under* the directory
# but not the directory path itself, so hatchling walks into node_modules anyway. Its
# walk follows symlinks and skips inodes it has already seen, and pnpm links
# web/apps/panel/node_modules/@indi-nexus/* at the real web/packages/* - so the walk
# consumed those inodes through the link and then dropped the real package sources
# from the sdist. Excluding the directory itself keeps the walk out of it entirely.
[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "**/node_modules",
    # `skip-excluded-dirs` prunes on exclusion alone, and unlike `include_path` it does
    # not consult `artifacts` - so without this the gitignored panel build output would
    # be pruned before the force-include below could bring it back.
    "!src/indi_nexus/web/static/panel",
]

# Build (and bundle) the TypeScript reference panel into the distribution so a
# plain `pip install` ships the UI. See hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/indi_nexus"]
# The built panel lives under the (gitignored) static dir; force-include it.
artifacts = ["src/indi_nexus/web/static/panel/**/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/indi_nexus/web/static/panel/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The interop suite needs a real libindi and is slow, so it is not part of a normal
# run. Its conftest skips the whole package when indiserver is absent, which keeps
# `pytest` green for a contributor who has not installed it; CI runs it nightly with
# `--interop`. See tests/interop/README.md.
addopts = "--ignore=tests/interop"
filterwarnings = [
    # Transitional upstream warning from starlette's TestClient (httpx -> httpx2).
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

