<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INDINexus - debug inspector</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa3b2; --accent: #4f8cff;
    --idle: #6b7280; --ok: #16a34a; --busy: #d97706; --alert: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 999px; background: var(--panel2); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--alert); }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 12px; color: var(--text); background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 460px; height: calc(100vh - 49px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  .col { overflow-y: auto; padding: 14px; }
  .col.log { background: #0b0d11; border-left: 1px solid var(--border); }
  h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 4px 0 10px; }
  .device > h3 { font-size: 14px; margin: 18px 0 8px; border-bottom: 1px solid var(--border);
    padding-bottom: 4px; }
  .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 10px 0 6px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head .name { font-weight: 600; }
  .card-head .meta { color: var(--muted); font-size: 12px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .chip.Idle { background: var(--idle); } .chip.Ok { background: var(--ok); }
  .chip.Busy { background: var(--busy); } .chip.Alert { background: var(--alert); }
  .elem { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .elem .lbl { min-width: 130px; color: var(--muted); font-size: 13px; }
  .elem .val { font-variant-numeric: tabular-nums; }
  .elem input { font: inherit; width: 120px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  .sw { border-radius: 999px; padding: 2px 12px; font-size: 12px; }
  .sw.on { background: var(--ok); color: #fff; border-color: var(--ok); }
  .sw.off { background: var(--panel2); }
  .light { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .setbtn { margin-top: 6px; }
  .empty { color: var(--muted); font-style: italic; padding: 20px 4px; }
  .logline { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    padding: 2px 0; border-bottom: 1px solid #14171d; white-space: pre-wrap; word-break: break-word; }
  .logline .ts { color: #5b6472; }
  .tag-def { color: #4f8cff; } .tag-set { color: #22c55e; } .tag-del { color: #ef4444; }
  .tag-message { color: #eab308; } .tag-new { color: #a78bfa; } .tag-event { color: #9aa3b2; }
  .log-controls { display: flex; gap: 8px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1><span>INDI</span>Nexus debug</h1>
  <span class="pill"><span id="ws-dot" class="dot"></span> websocket</span>
  <span class="pill"><span id="up-dot" class="dot"></span> indiserver</span>
  <span class="pill" id="dev-count">0 devices</span>
  <span class="spacer"></span>
  <button id="reconnect">Reconnect</button>
</header>
<main>
  <div class="col props">
    <h2 class="section">Properties</h2>
    <div id="tree"><div class="empty">Waiting for properties&hellip;</div></div>
  </div>
  <div class="col log">
    <h2 class="section">Message feed</h2>
    <div class="log-controls">
      <button id="pause">Pause</button>
      <button id="clear">Clear</button>
    </div>
    <div id="log"></div>
  </div>
</main>
<script>
"use strict";
// device -> name -> vector (mirrors the server's cache from the streamed frames)
const store = {};
let ws = null, paused = false;

const $ = (id) => document.getElementById(id);
const STATES = { Idle: "var(--idle)", Ok: "var(--ok)", Busy: "var(--busy)", Alert: "var(--alert)" };

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  // A browser cannot set headers on a WebSocket handshake, so a bridge started
  // with a token is reached by carrying this page's own ?token= across to /ws.
  const token = new URLSearchParams(location.search).get("token");
  const query = token ? `?token=${encodeURIComponent(token)}` : "";
  ws = new WebSocket(`${proto}://${location.host}/ws${query}`);
  ws.onopen = () => setDot("ws-dot", true);
  ws.onclose = () => { setDot("ws-dot", false); setDot("up-dot", false); setTimeout(connect, 1500); };
  ws.onmessage = (ev) => handle(ev.data);
}

function setDot(id, on) { $(id).className = "dot " + (on ? "on" : "off"); }

function handle(text) {
  let msg;
  try { msg = JSON.parse(text); } catch { return; }
  if (msg.event === "connection") { setDot("up-dot", msg.connected); logLine("event", text); return; }
  logLine(msg.tag || "?", text);
  if (msg.tag === "def" || msg.tag === "set") applyVector(msg);
  else if (msg.tag === "delProperty") applyDelete(msg);
  // message frames only go to the log
  render();
}

function applyVector(msg) {
  const vec = msg.vector;
  const dev = (store[vec.device] ||= {});
  if (msg.tag === "def" || !dev[vec.name]) { dev[vec.name] = vec; return; }
  // merge a set onto the cached def: copy element values + status, keep metadata
  const cur = dev[vec.name];
  const byName = Object.fromEntries(cur.elements.map((e) => [e.name, e]));
  for (const el of vec.elements) {
    const c = byName[el.name];
    if (!c) continue;
    if ("value" in el) c.value = el.value;
    if ("data" in el) c.data = el.data;
  }
  // `state` is #IMPLIED on a set*Vector and means "no change if absent", so an
  // absent one must not reset a property latched into Alert. state_present says
  // whether the XML actually carried it. The bridge relays its own merged cache,
  // where the state is always set, so this is the belt to the server's braces -
  // and the chip below renders v.state straight into a class name, which an
  // undefined would turn into a blank badge.
  if (msg.state_present !== false && vec.state) cur.state = vec.state;
}

// A named delProperty removes one property and leaves the device, even when it
// was the last one: a driver that defines on connect publishes nothing at all
// while disconnected, and that is not the same as the device being gone, which
// is what an unnamed delProperty means. Same rule in client/store.py and
// packages/client/src/store.ts.
function applyDelete(msg) {
  if (!store[msg.device]) return;
  if (msg.name) delete store[msg.device][msg.name]; else delete store[msg.device];
}

function render() {
  const devices = Object.keys(store).sort();
  $("dev-count").textContent = `${devices.length} device${devices.length === 1 ? "" : "s"}`;
  const tree = $("tree");
  if (!devices.length) { tree.innerHTML = '<div class="empty">Waiting for properties&hellip;</div>'; return; }
  tree.innerHTML = "";
  for (const dev of devices) {
    const dEl = document.createElement("div");
    dEl.className = "device";
    dEl.innerHTML = `<h3>${esc(dev)}</h3>`;
    const names = Object.keys(store[dev]).sort();
    // A device with nothing in it is a state worth naming rather than a bare
    // heading: it is what a driver that defines on connect looks like while
    // disconnected, and the operator should see that it is still here.
    if (!names.length) {
      dEl.insertAdjacentHTML("beforeend", '<div class="empty">No properties defined right now.</div>');
    }
    const groups = {};
    for (const name of names) {
      const v = store[dev][name];
      (groups[v.group || ""] ||= []).push(v);
    }
    for (const g of Object.keys(groups).sort()) {
      if (g) dEl.insertAdjacentHTML("beforeend", `<div class="group-label">${esc(g)}</div>`);
      for (const v of groups[g]) dEl.appendChild(card(v));
    }
    tree.appendChild(dEl);
  }
}

function card(v) {
  const el = document.createElement("div");
  el.className = "card";
  const rw = v.perm && v.perm.includes("w");
  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML =
    `<span class="name">${esc(v.label || v.name)}</span>` +
    `<span class="chip ${v.state}">${v.state}</span>` +
    `<span class="meta">${esc(v.name)}${v.perm ? " &middot; " + v.perm : ""}</span>`;
  el.appendChild(head);
  for (const e of v.elements) el.appendChild(elementRow(v, e, rw));
  if (rw && v.kind !== "switch") {
    const b = document.createElement("button");
    b.className = "setbtn"; b.textContent = "Set";
    b.onclick = (ev) => sendVector(v, ev.target);
    el.appendChild(b);
  }
  return el;
}

function elementRow(v, e, rw) {
  const row = document.createElement("div");
  row.className = "elem";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = e.label || e.name;
  row.appendChild(lbl);
  if (v.kind === "switch") {
    const b = document.createElement("button");
    const on = e.value === "On";
    b.className = "sw " + (on ? "on" : "off"); b.textContent = on ? "On" : "Off";
    if (rw) b.onclick = () => sendSwitch(v, e);
    row.appendChild(b);
  } else if (v.kind === "light") {
    const d = document.createElement("span");
    d.className = "light"; d.style.background = STATES[e.value] || "var(--idle)";
    row.appendChild(d);
    row.insertAdjacentHTML("beforeend", `<span class="val">${esc(e.value)}</span>`);
  } else if (rw) {
    const inp = document.createElement("input");
    inp.value = e.value ?? ""; inp.dataset.name = e.name; inp.dataset.kind = v.kind;
    row.appendChild(inp);
  } else {
    row.insertAdjacentHTML("beforeend", `<span class="val">${esc(String(e.value ?? ""))}</span>`);
  }
  return row;
}

function sendVector(v, btn) {
  const inputs = [...btn.closest(".card").querySelectorAll("input")];
  const elements = inputs.map((i) => ({
    kind: i.dataset.kind, name: i.dataset.name,
    value: i.dataset.kind === "number" ? Number(i.value) : i.value,
  }));
  send({ tag: "new", vector: { kind: v.kind, device: v.device, name: v.name, elements } });
}

function sendSwitch(v, e) {
  const next = e.value === "On" ? "Off" : "On";
  send({ tag: "new", vector: { kind: "switch", device: v.device, name: v.name,
    elements: [{ kind: "switch", name: e.name, value: next }] } });
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) { const s = JSON.stringify(obj); ws.send(s); logLine("new", s); }
}

function logLine(tag, text) {
  if (paused) return;
  const div = document.createElement("div");
  div.className = "logline";
  const ts = new Date().toLocaleTimeString();
  div.innerHTML = `<span class="ts">${ts}</span> <span class="tag-${tag}">${esc(tag)}</span> ${esc(text)}`;
  const log = $("log");
  log.appendChild(div);
  while (log.childElementCount > 500) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

$("reconnect").onclick = () => { if (ws) ws.close(); };
$("pause").onclick = (e) => { paused = !paused; e.target.textContent = paused ? "Resume" : "Pause"; };
$("clear").onclick = () => { $("log").innerHTML = ""; };
connect();
</script>
</body>
</html>
