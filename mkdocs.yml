site_name: INDINexus
site_description: >-
  A modern, typed Python framework for INDI astronomical instrument control -
  Python drivers, an async client, a web bridge, and React components.
site_url: https://indi-nexus.sidereal.software/
repo_url: https://github.com/sidereal-software/indi-nexus
repo_name: indi-nexus

theme:
  name: material
  # `custom` matches no rule Material ships, which is the point: docs/stylesheets/palette.css
  # then owns every primary/accent variable outright. Read the comment at the top of that
  # file before changing either of these - `custom` also forfeits Material's per-colour link
  # overrides, so the link colour has to be set per scheme there or slate links go
  # dark-on-dark. Keep the scheme names as-is; inventing one loses slate's ~40 surface vars.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/telescope
  features:
    # Instant navigation only rewrites links that appear in sitemap.xml. MkDocs treats the
    # three demo .html files as static pages and leaves them out of it, so clicking a demo
    # still does a full page load - which is what those standalone Vite apps need.
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    # Selecting a tab by its label - uv over pip, say - selects the same label in every
    # other tabbed block on the site. Needs pymdownx.tabbed's alternate_style, set below.
    - content.tabs.link
    - search.suggest

extra_css:
  - stylesheets/palette.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  # The custom fence renders ```mermaid blocks as diagrams; the architecture
  # diagrams in index.md and the guides rely on it.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Lets docs/changelog.md pull in the three CHANGELOG.md files Release Please writes,
  # so the release notes are not duplicated. check_paths fails the build if one moves.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  # Generates the og:/twitter: preview image every page links to, so a URL pasted into
  # Slack or Matrix renders as a card instead of a bare link. It needs Pillow and cairosvg,
  # which is why the docs extra is mkdocs-material[imaging]; cairosvg in turn dlopens the
  # system libcairo. Ubuntu runners already have it. On macOS it is
  # `brew install cairo freetype libffi`, and on Apple Silicon that is not sufficient on its
  # own - Homebrew installs to /opt/homebrew/lib, which is not on the dynamic loader's
  # search path, so ctypes cannot find libcairo and every page logs a warning that fails
  # --strict. Build with DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib, or set CARDS=false to
  # skip card generation entirely: the site still builds, it just ships no preview images.
  - social:
      cards: !ENV [CARDS, true]
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Docker: docker.md
  - Guides:
      - Writing a driver: guides/writing-drivers.md
      - 'Tutorial: real data, custom UI': guides/tutorial-open-meteo.md
      - Porting from pyINDI: guides/porting-from-pyindi.md
      - The examples: guides/examples.md
      - Building a frontend: guides/frontend.md
      - Protocol concepts: guides/protocol.md
  - Python API:
      - Exceptions: reference/python/exceptions.md
      - Protocol: reference/python/protocol.md
      - Driver SDK: reference/python/driver.md
      - Testing: reference/python/testing.md
      - Client: reference/python/client.md
      - Web bridge: reference/python/web.md
      - Transport: reference/python/transport.md
  - TypeScript API:
      - "@indi-nexus/client": reference/typescript/client/index.md
      - "@indi-nexus/react": reference/typescript/react/index.md
  - Changelog: changelog.md
  - Live demo: demo-app/index.html
  - Flat panel demo: flat-demo/flat.html
  - Weather demo: weather-demo/weather.html
