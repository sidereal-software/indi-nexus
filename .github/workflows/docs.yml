name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install workspace dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build the TypeScript libraries (the demo builds against them)
        working-directory: web
        run: pnpm -r build
      - name: Generate the TypeScript API reference and the live demo
        working-directory: web
        run: pnpm run docs

      - uses: astral-sh/setup-uv@v9
      - name: Build the site
        run: |
          uv venv --python 3.12
          uv pip install -e ".[docs]"
          uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
