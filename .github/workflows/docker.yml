name: docker

# Publishes the runtime image to GHCR. Unlike release.yml, this needs no account
# anywhere: the repository is public, GHCR authenticates with the built-in
# GITHUB_TOKEN, and the image builds the wheel from this checkout rather than
# installing indi-nexus from PyPI. So it is not blocked on the PyPI and npm
# trusted-publisher setup that release.yml still needs.
#
# Cadence: one image per release, which is what the version tags are for. A pull
# request that touches the image builds it without pushing, so the Dockerfile
# cannot rot unnoticed between releases, and workflow_dispatch publishes on
# demand.
#
# ONE-TIME SETUP: the first push creates the package as private. Make it public
# once at Settings -> Packages -> indi-nexus -> Change visibility, or `docker
# pull` will ask strangers for credentials.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (the digest is always tagged too)"
        required: false
        default: ""
  pull_request:
    paths:
      - "docker/**"
      - "compose.yaml"
      - ".dockerignore"
      - "src/**"
      - "web/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }}
    # Release Please cuts three releases from one merge - indi-nexus-v, client-v
    # and react-v - so a release event fires three times. Only the Python
    # package's release describes what is in this image; without this guard the
    # two npm releases would each republish :latest carrying no version tag.
    if: >-
      github.event_name != 'release'
      || startsWith(github.event.release.tag_name, 'indi-nexus-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR; unused on the pull_request path
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated. It is slow, and the honest reason to accept that is
      # that this runs once per release rather than on every push. If it becomes
      # painful, the fix is a matrix over ubuntu-latest and ubuntu-24.04-arm
      # building by digest plus a manifest-merge job, which is free for a public
      # repository and needs no QEMU.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release Please tags the Python package indi-nexus-vX.Y.Z, so the ref is
      # not a bare semver and `type=semver` would read the component prefix as
      # part of the version. match/group pulls the version back out.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=indi-nexus-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=indi-nexus-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=INDINexus

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that produces an image nobody can run is not a passing build.
      # Only the native arch is loadable here, which is the one worth smoke
      # testing anyway.
      - name: Check the image actually serves the panel
        run: |
          set -euo pipefail
          docker buildx build --load --file docker/Dockerfile --target runtime \
            --build-arg VERSION=ci --tag indi-nexus:ci --cache-from type=gha .
          docker run -d --name smoke -p 8000:8000 indi-nexus:ci
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8000/api/devices | tee /dev/stderr | grep -q 'Telescope Simulator'
          curl -sf http://127.0.0.1:8000/ | grep -q '<title>INDINexus</title>'
          echo "OK: health, a device, and the compiled panel"
      - name: Show the container log if that failed
        if: failure()
        run: docker logs smoke || true
